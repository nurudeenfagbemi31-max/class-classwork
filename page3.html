<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Password - Blackgrid Autos</title>
    <link rel="stylesheet" href="page3.css">
</head>
<body>
    <a href="page2.html" class="back-home">← Back</a>

    <div class="formbox">
        <h2>BLACKGRID <span>AUTOS</span></h2>
        <h3>Create a Password</h3>
        <p class="subtitle">Step 3 of 3 - Final Step</p>

        <div class="progress">
            <div class="progress-fill"></div>
        </div>

        <form onsubmit="return checkPassword()">
            <label for="password">Password</label>
            <div class="password-wrap">
                <input type="password" id="password" placeholder="Choose a strong password" required>
                <span onclick="togglePass('password', this)">👁️</span>
            </div>
            <p class="hint">Use 8+ characters with letters & numbers</p>

            <label for="confirmPassword">Confirm Password</label>
            <div class="password-wrap">
                <input type="password" id="confirmPassword" placeholder="Repeat password" required>
                <span onclick="togglePass('confirmPassword', this)">👁️</span>
            </div>
            <p id="error" class="error"></p>

            <button type="submit">Create Account</button>
        </form>

        <p class="bottom-text">By creating an account, you agree to Blackgrid Terms.</p>
    </div>

    <script>
        function togglePass(id, el) {
            const input = document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
                el.textContent = "🙈";
            } else {
                input.type = "password";
                el.textContent = "👁️";
            }
        }

        function checkPassword() {
            const pass = document.getElementById("password").value;
            const confirm = document.getElementById("confirmPassword").value;
            const error = document.getElementById("error");

            if (pass.length < 8) {
                error.textContent = "Password must be at least 8 characters!";
                return false;
            }
            if (pass !== confirm) {
                error.textContent = "Passwords do not match!";
                return false;
            }
            alert("Welcome to Blackgrid Autos! Account Created Successfully 🎉");
            window.location.href = "navigation.html";
            return false;
        }
    </script>
</body>
</html>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
body {
    background: black;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
.back-home {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #FFC107;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
}
.formbox {
    background: #141414;
    width: 100%;
    max-width: 420px;
    padding: 35px 30px;
    border-radius: 12px;
    border: 1px solid #222;
    border-top: 3px solid #FFC107;
    text-align: center;
}
.formbox h2 { font-size: 24px; letter-spacing: 1px; }
.formbox h2 span { color: #FFC107; }
.formbox h3 { color: #ddd; margin: 8px 0 4px; font-size: 18px; }
.subtitle { color: #888; font-size: 13px; margin-bottom: 15px; }

.progress { background: #222; height: 6px; border-radius: 10px; overflow: hidden; margin-bottom: 25px; }
.progress-fill { background: #FFC107; width: 100%; height: 100%; }

form { text-align: left; }
label { display: block; font-size: 13px; color: #aaa; margin: 15px 0 6px; }

.password-wrap { position: relative; }
.password-wrap input {
    width: 100%;
    padding: 13px 40px 13px 13px;
    background: #0a0a0a;
    border: 1px solid #333;
    border-radius: 6px;
    color: white;
    outline: none;
    font-size: 14px;
}
.password-wrap input:focus { border-color: #FFC107; }
.password-wrap span {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 16px;
}
.hint { font-size: 11px; color: #666; margin-top: 6px; }
.error { font-size: 13px; color: #ff4d4d; margin-top: 8px; min-height: 18px; }

button {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    background: #FFC107;
    color: black;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}
button:hover { background: white; }
.bottom-text { margin-top: 20px; font-size: 12px; color: #888; text-align: center; }

@media (max-width: 480px) {
    .formbox { padding: 25px 20px; }
    .back-home { position: static; display: block; margin-bottom: 15px; text-align: left; }
    body { flex-direction: column; align-items: stretch; }
}
</style>
